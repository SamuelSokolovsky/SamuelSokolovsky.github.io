<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
  <style>
    body { max-width: 860px; margin: 40px auto; padding: 0 20px; font-family: Georgia, serif; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #555; margin-bottom: 2rem; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px solid #eee; }
    .post-list a { font-size: 1.15rem; font-weight: bold; text-decoration: none; color: #0366d6; }
    .post-meta { color: #888; font-size: 0.85rem; margin-top: 0.2rem; }
  </style>
</head>
<body>
  <h1>{{ site.title }}</h1>
  <p class="subtitle">IS 445 Data Visualization</p>

  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      <div class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</div>
      {% if post.description %}<div>{{ post.description }}</div>{% endif %}
    </li>
    {% endfor %}
  </ul>

  {{ content }}
</body>
</html>
