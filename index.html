<!DOCTYPE html>
<html>
<head>
    <title>HW5 Charts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 1000px;
            border-radius: 15px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        iframe {
            width: 100%;
            height: 550px;
            border: none;
            border-radius: 10px;
        }

        .notebook {
            margin-top: 30px;
        }

        .notebook a {
            background-color: #222;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
        }

        .notebook a:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <h1>HW5 Data Visualization</h1>
    <p>Below are my two interactive charts for HW5.</p>

    <div class="chart-container">
        <h2>Chart 1</h2>
        <iframe src="chart1.html"></iframe>
    </div>

    <div class="chart-container">
        <h2>Chart 2</h2>
        <iframe src="chart2.html"></iframe>
    </div>

    <div class="notebook">
        <a href="is445_hw5.ipynb">Download Notebook</a>
    </div>

</body>
</html>
