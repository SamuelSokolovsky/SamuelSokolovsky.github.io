<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
  <style>
    body { max-width: 860px; margin: 40px auto; padding: 0 20px; font-family: Georgia, serif; }
    h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .meta { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    vegachart { display: block; margin: 2rem 0 1rem 0; }
    h2 { font-size: 1.2rem; margin-top: 2rem; }
    p { line-height: 1.7; }
    nav { margin-bottom: 2rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0366d6; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">← Home</a>
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
  </nav>

  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>

  {{ content }}

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script>
    document.querySelectorAll("vegachart").forEach(function(el) {
      var schemaUrl = el.getAttribute("schema-url");
      vegaEmbed(el, schemaUrl, {actions: true}).catch(console.error);
    });
  </script>
</body>
</html>
